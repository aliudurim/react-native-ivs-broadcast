import groovy.json.JsonSlurper

buildscript {
  ext.getExtOrDefault = { name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["IvsBroadcast_" + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return getExtOrDefault(name).toString().toInteger()
}

def pkg = new JsonSlurper().parseText(file("../package.json").text)
// Apps can pin a different SDK build with `ivsBroadcastSdkVersion` in the root project's ext.
def ivsSdkVersion = rootProject.ext.has("ivsBroadcastSdkVersion")
  ? rootProject.ext.get("ivsBroadcastSdkVersion")
  : pkg.ivsSdk.android

android {
  namespace "com.ivsbroadcast"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  lintOptions {
    disable "GradleCompatible"
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  api "com.amazonaws:ivs-broadcast:${ivsSdkVersion}:stages@aar"
}
